  <text x="12" y="23" font-family="Arial" font-size="10" font-weight="700">Error común</text><text x="12" y="44" font-family="Arial" font-size="8">Confundir urgencia</text><text x="12" y="58" font-family="Arial" font-size="8">con dirección.</text>
  <text x="252" y="23" font-family="Arial" font-size="10" font-weight="700">Revisión del consejo</text><text x="252" y="44" font-family="Arial" font-size="8">¿Qué decisión puede</text><text x="252" y="58" font-family="Arial" font-size="8">esperar un poco?</text>
