server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTML always revalidates so deploy changes appear immediately.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Runtime configuration must NEVER be cached.
  # This lets price / checkout / bonus changes take effect after every deploy.
  location = /js/config.js {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets may remain cached. config.js is excluded by the exact location above.
  location ~* \.(css|js|svg|png|jpg|jpeg|webp)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
